apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-service
  namespace: stream-team
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movie-service
  template:
    metadata:
      labels:
        app: movie-service
    spec:
      containers:
        - name: movie-service
          image: stream-team-movie-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: stream-team-config
                  key: SERVER_PORT_MOVIE_SERVICE
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stream-team-secrets
                  key: TMDB_API_KEY
            - name: TMDB_READ_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: stream-team-secrets
                  key: TMDB_READ_ACCESS_KEY
            - name: TMDB_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: stream-team-config
                  key: TMDB_BASE_URL
            - name: TMDB_IMAGE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: stream-team-config
                  key: TMDB_IMAGE_BASE_URL
            - name: VIDSRC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: stream-team-config
                  key: VIDSRC_BASE_URL
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: stream-team-config
                  key: CORS_ALLOWED_ORIGINS
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
---
apiVersion: v1
kind: Service
metadata:
  name: movie-service
  namespace: stream-team
spec:
  selector:
    app: movie-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
