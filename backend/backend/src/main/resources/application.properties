spring.application.name=backend

server.port=8080

# MongoDB Atlas — never commit the real URI
spring.data.mongodb.uri=${MONGODB_URI:}
spring.data.mongodb.database=${MONGODB_DATABASE:stream_db}

# Paystack TEST mode only — never commit the secret
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.base-url=https://api.paystack.co
