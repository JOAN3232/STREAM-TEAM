spring:
  application:
    name: movie-service

server:
  port: ${SERVER_PORT:8082}

tmdb:
  api-key: ${TMDB_API_KEY:}
  read-access-key: ${TMDB_READ_ACCESS_KEY:}
  base-url: ${TMDB_BASE_URL:https://api.themoviedb.org/3}
  image-base-url: ${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p}
  connect-timeout-ms: 5000
  read-timeout-ms: 8000

vidsrc:
  base-url: ${VIDSRC_BASE_URL:https://vidsrcme.ru}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
