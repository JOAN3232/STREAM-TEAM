spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/streamteam}

server:
  port: ${SERVER_PORT:8081}

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-32b}
  expiration-ms: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
