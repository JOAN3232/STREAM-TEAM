services:
  mongodb:
    image: mongo:7
    container_name: streamteam-mongodb
    profiles: ["localdb"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  movie-service:
    build:
      context: ./movie-service
    environment:
      SERVER_PORT: 8082
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_READ_ACCESS_KEY: ${TMDB_READ_ACCESS_KEY:-}
      TMDB_BASE_URL: ${TMDB_BASE_URL:-https://api.themoviedb.org/3}
      TMDB_IMAGE_BASE_URL: ${TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p}
      VIDSRC_BASE_URL: ${VIDSRC_BASE_URL:-https://vidsrcme.ru}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
    ports:
      - "8082:8082"

  auth-service:
    build:
      context: ./auth-service
    environment:
      SERVER_PORT: 8081
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongodb:27017/streamteam}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-key-32b}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-STREAM <noreply@example.com>}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
    ports:
      - "8081:8081"

  user-service:
    build:
      context: ./user-service
    environment:
      SERVER_PORT: 8083
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongodb:27017/streamteam}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-key-32b}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      PAYSTACK_BASE_URL: ${PAYSTACK_BASE_URL:-https://api.paystack.co}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL:-http://localhost:5173/payment}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
    ports:
      - "8083:8083"

  api-gateway:
    build:
      context: ./api-gateway
    environment:
      SERVER_PORT: 8080
      MOVIE_SERVICE_URL: ${MOVIE_SERVICE_URL:-http://movie-service:8082}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8083}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
    depends_on:
      - movie-service
      - auth-service
      - user-service
    ports:
      - "8080:8080"

volumes:
  mongo-data:
