services:
  mongodb:
    image: mongo:7
    container_name: streamteam-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  movie-service:
    build:
      context: ./movie-service
    environment:
      SERVER_PORT: 8082
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_READ_ACCESS_KEY: ${TMDB_READ_ACCESS_KEY}
      TMDB_BASE_URL: ${TMDB_BASE_URL}
      TMDB_IMAGE_BASE_URL: ${TMDB_IMAGE_BASE_URL}
      VIDSRC_BASE_URL: ${VIDSRC_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "8082:8082"
    dns:
      - 8.8.8.8
      - 1.1.1.1

  auth-service:
    build:
      context: ./auth-service
    environment:
      SERVER_PORT: 8081

      MONGODB_URI: mongodb://mongodb:27017/streamteam

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}

      FRONTEND_URL: ${FRONTEND_URL}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy

  user-service:
    build:
      context: ./user-service
    environment:
      SERVER_PORT: 8083

      MONGODB_URI: mongodb://mongodb:27017/streamteam

      JWT_SECRET: ${JWT_SECRET}

      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      PAYSTACK_BASE_URL: ${PAYSTACK_BASE_URL}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

    ports:
      - "8083:8083"
    depends_on:
      mongodb:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
    environment:
      SERVER_PORT: 8080

      MOVIE_SERVICE_URL: ${MOVIE_SERVICE_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

    depends_on:
      - movie-service
      - auth-service
      - user-service

    ports:
      - "8080:8080"

volumes:
  mongo-data:
